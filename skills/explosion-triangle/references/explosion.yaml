status: placeholder
reviewed_by: null

# 火区混合气体爆炸三角形的参数（开发占位值）
#
# 来源：explosion-triangle-synthesis 技能的参数表（温度补偿爆炸三角形合成法）。
# TODO(专家): 顶点坐标、温度修正系数、N2/O2 当量比都要按本矿采用的标准或试验数据审定；
#   温度公式统一用于全部可燃组分是工程外推，没有逐种气体的试验验证。
# 坐标单位：横轴 = 可燃气体体积分数（%），纵轴 = O2 体积分数（%）。

air_o2_pct: 20.93            # 空气点 (0, 20.93)
n2_per_o2: 3.73              # 没有可用的 N2 实测值时，S 点合成用的 N2 当量权重 = 3.73 × O2（空气中 N2/O2 之比）
temperature:
  reference_c: 25.0          # 顶点坐标对应的温度
  coefficient_per_c: 0.000721  # rT = 系数 × (T − 25)；L 点横坐标 × (1 − rT)，U 点横坐标 × (1 + rT)
  min_c: -40.0               # 允许输入的温度范围（参考装置量程，不代表公式在整个范围都验证过）
  max_c: 125.0
composition_tolerance_pct: 0.5   # 可燃气体 + O2 + CO2（+ 实测 N2）之和允许超出 100% 的量（测量误差）
sample_window_h: 6           # 按测点计算时，在最近多少小时内找同一时刻的完整一组读数

# 各可燃组分 25℃ 时的顶点：L 爆炸下限点、U 爆炸上限点、
# S_N2 用 N2 惰化时的临界点（鼻点）、S_CO2 用 CO2 惰化时的临界点
gases:
  CH4:   {L: [5.00, 19.88],  U: [15.00, 17.79], S_N2: [5.18, 9.47],  S_CO2: [5.96, 12.32]}
  H2:    {L: [4.00, 20.09],  U: [74.20, 5.40],  S_N2: [4.20, 5.13],  S_CO2: [5.20, 8.46]}
  CO:    {L: [12.50, 18.81], U: [74.20, 5.40],  S_N2: [13.06, 5.16], S_CO2: [15.67, 8.01]}
  C2H2:  {L: [2.50, 20.41],  U: [80.00, 4.19],  S_N2: [2.36, 5.07],  S_CO2: [3.27, 8.51]}
  C2H4:  {L: [2.75, 20.35],  U: [28.60, 14.49], S_N2: [2.89, 6.06],  S_CO2: [3.53, 9.45]}
  C2H6:  {L: [3.00, 20.30],  U: [12.50, 18.31], S_N2: [3.12, 8.41],  S_CO2: [3.82, 11.17]}
  C3H6:  {L: [2.00, 20.51],  U: [11.10, 18.61], S_N2: [2.09, 7.62],  S_CO2: [2.50, 10.92]}
  C3H8:  {L: [2.12, 20.49],  U: [9.35, 18.97],  S_N2: [2.21, 8.36],  S_CO2: [2.61, 11.57]}
  C4H10: {L: [1.86, 20.54],  U: [8.41, 19.17],  S_N2: [1.93, 8.39],  S_CO2: [2.29, 11.57]}
