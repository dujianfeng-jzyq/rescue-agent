articles:
  - document: 矿山救援规程
    article: 第39条
    text: 事故发生后，涉险区域人员应在安全条件下积极抢救人员和控制灾情并立即上报；不具备条件的立即撤离至安全地点，撤离时根据需要使用自救器，撤离受阻时紧急避险待救。
  - document: 矿山救援规程
    article: 第40条
    text: 值班调度员接到事故报告后，应立即通知涉险区域人员撤离险区，报告矿山企业负责人，通知矿山救援队、医疗急救机构和有关人员到现场救援。
  - document: 矿山救援规程
    article: 第73条
    text: 参加矿井火灾救援应了解：火灾类型、发火时间、火源位置、火势及烟雾、波及范围、遇险人员分布和安全避险系统；有毒有害气体、温度、通风系统状态、风流方向和风量、矿尘爆炸性；顶板和支护；灾区供电；供水管路和消防器材；火灾专项应急预案及实施状况。
