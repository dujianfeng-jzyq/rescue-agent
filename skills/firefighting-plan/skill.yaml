# 第二版技能的脚本登记（skills/README.md）。只有登记过的脚本能被证据插件运行。
scripts:
  skeleton:
    file: scripts/skeleton.py
    description: 防灭火处置方案骨架：现场条件（甲烷、氧浓度、爆炸危险性）、必备步骤、可选步骤的选择清单（不安排人员进入灾区，没有人工确认项）
    timeout_s: 20
  compose:
    file: scripts/compose.py
    description: 按“方案编写”阶段的选择组装防灭火方案，计算注氮流量、注浆量并与库存比较
    timeout_s: 20
