# 闭环跟踪的编排参数（第三版 P4，docs/design-v3.md 6.4）。演示用占位值，待专家审定。
# add_followup 不给 after_h 时取 default_after_h；给了也不能超过 max_after_h。复评的判据在 effect-review 技能里。
status: placeholder
reviewed_by: null

default_after_h: 2     # 处置下发后多少矿井小时复评
max_after_h: 48

# 按预警等级的复评间隔上限（矿井小时）：add_followup 不给 after_h 时，到点时间取“复评给出的下次复评时刻 / 默认间隔”和这个上限中较早的；
# 等级取最近一次研判。封闭方案下发后不再按等级限制（封闭后的观测按复评的节奏）。2026-11-11 加（橙色未处置、复评恶化时曾隔 12 小时才复评）。
# 当前取值偏长是为了演示（橙色 2 小时时，橙色未处置要停很多次才走到红色，2026-11-11 用户决定），专家审定后改为实际值；
# 等级越高上限不能越长（有测试）。
level_cap_h:
  blue: 8
  yellow: 8
  orange: 6
  red: 1
