# 采空区自燃预警分级与自燃发展阶段的阈值（演示用占位值）
# 由 mcp/fire-model/src/rescue_fire_model/thresholds.yaml 的分级、stage 两节迁移，数值未改。
#
# TODO(专家): 按客户矿井的《自然发火预测预报制度》和煤层标志气体临界值替换。
# 格雷哈姆系数的分级参照常用文献值（<0.4 正常；0.5 需关注；1.0 严重；2.0 活跃燃烧；>3 明火），需专家确认。
status: placeholder
reviewed_by: null

# 每一级满足任一条件即触发；取满足条件的最高级别。
levels:
  blue:
    uc_co_ppm: 10          # 上隅角 CO
    tube_co_ppm: 40        # 束管 CO（任一测点）
    tube_co_rate_ppm_h: 1  # 束管 CO 近 rate_window_h 小时上升速率
  yellow:
    uc_co_ppm: 18
    tube_co_ppm: 80
    graham_ratio: 0.5
  orange:
    uc_co_ppm: 24
    tube_co_ppm: 200
    c2h4_ppm: 0.3          # 乙烯出现
    graham_ratio: 1.0
  red:
    tube_co_ppm: 1000
    c2h4_ppm: 2.0
    c2h2_ppm: 0.1          # 乙炔出现

# 定级回差（2026-11-12 加，占位值，待专家审定）：按阈值算出的等级低于上一次时，上一次那一级的任一指标仍不低于
# “阈值 × (1 − band)”就保持该级，全部回落到解除值以下才降级；升级不受影响（仍按阈值立即升）。读不到数的指标不算“仍不低于”。
# 上一次：完整研判取本事件最近一次研判的预警等级记录，监听器取它的基线。
# 起因：封闭注惰后乙烯被稀释到红色阈值以下（2.07 → 1.82），等级红→橙，数小时后积聚回 2.10 又升红。
hysteresis:
  band: 0.2

# 自燃发展阶段（与预警等级独立判定）。
# TODO(专家): 按本矿煤样程序升温实验的标志气体出现条件替换。
# 自高到低判定，满足该阶段任一条件即是该阶段；束管 CO 不可用时为 unknown。
stage:
  intense:                 # 激烈氧化，接近明火：乙炔检出
    c2h2_ppm: 0.05
  accelerating:            # 加速氧化：乙烯检出
    c2h4_ppm: 0.05
  slow_oxidation:          # 缓慢氧化：束管 CO 偏高或持续上升
    tube_co_ppm: 25
    tube_co_rate_ppm_h: 0.2

window_h: 24               # 预警判定用的数据窗口（数据质量检测在这段序列上做）
rate_window_h: 12          # 束管 CO 上升速率的计算窗口
