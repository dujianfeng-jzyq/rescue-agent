# 风险检测的参数（design-v2 4.9“检测判据”初稿，演示用占位值，待专家评审）。
# check.py 用 anomaly、required、data_gap_h；证据插件的持续检测（check_mine watch）用 interval_min、max_hours、
# fetch_failures（只是编排参数，判据都在 check.py）。
status: placeholder
reviewed_by: null

panels: ["1201"]            # check_mine 缺省检测的工作面
interval_min: 10            # 持续检测的间隔（矿井分钟）
max_hours: 72               # 持续检测的最长时长（矿井小时），到时结束并报告“检测到期、未见异常”
fetch_failures: 3           # 取数连续失败这么多次算数据中断（证据插件按它结束持续检测）

# 必需测点：这些测点组里的这些参数被判为故障、卡值或没有数据时，算“必需测点失效”
required:
  tubes: [CO, O2]
  upper_corner: [CO, CH4]
  return: [CO, CH4]

# 数据中断：必需参数的最新读数早于这么多小时（按测点组；约为 3 个采样周期：束管 1 小时、安全监控 15 分钟采一次）。
# 设计初稿是“连续 3 个检测周期”，但束管、安全监控的采样周期都长于检测间隔，改为按时长。TODO(专家): 按本矿采样制度定
data_gap_h:
  tubes: 3
  upper_corner: 0.75
  return: 0.75

# 相对基线，出现任一项算异常（没有基线时与“正常状态”比较：等级无、未见自燃征兆、无报警、无失效测点）
anomaly:
  new_alarm: true           # 出现基线里没有的报警（按规则编号 + 测点区分）
  level_up: true            # 预警等级高于基线
  stage_up: true            # 自燃阶段推进
  required_failed: true     # 基线时正常的必需测点失效，或必需测点组没有匹配的测点
  data_gap: true            # 基线时正常的必需参数超过 data_gap_h 没有新数据
