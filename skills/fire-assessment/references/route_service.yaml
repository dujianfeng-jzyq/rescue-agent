# 外部路径规划服务（避灾路线：外部为主、我方兜底）的输入参数：快速接入阶段的占位值（docs/design-v6-route-service.md 第 4 节、附录 A.2、附录 B）。
# 所有结果标明“试验性”；拿到矿方数据后逐项替换（第 7 节），拿到提供方答复后调整（第 6 节）。
# 步行速度、缺省风速、最小风速取 personnel.yaml（与我方路线一致），不在这里重复。
status: placeholder
reviewed_by: null

section_height_m: 3.0               # 巷道高度占位值（矿方断面数据到位后替换）
section_width_m: 4.0                # 巷道宽度占位值；3 × 4 = 12 m²，与 personnel.yaml 的缺省断面一致
smoke_concentration_contaminated: 50   # 我方算出的受污染巷道（沿风流下风侧）的烟雾浓度占位值；服务取值 [0, 100]，其余巷道为 0
max_smoke_time_s: 900               # 允许的最大烟中通行时间（示例值），待专家按自救器额定防护时间确定
wind_speed_limit_m_s: 15            # 服务的风速范围 [-15, 15]；估算风速超出时截到此值并在 warnings 里说明
