id: s2-slow-oxidation
name: 缓慢氧化，及时处置后受控
description: >
  推进速度偏慢，采空区高温点缓慢升温，约 2 天后上隅角 CO 和束管 CO 明显上升。
  不处置时约第 3 天出现乙烯；若在第 2 天前后采取注氮加堵漏，升温基本被遏制，
  但仍需持续处置（检验第 2 阶段“效果评估”能否判断为“需继续处置”而非“已受控”）。
  这是一期打通闭环的首选场景。
start: 2026-11-02T08:00:00
duration_h: 120
speed: 1200
params:
  leak_m3_min: 40
  k_ox: 1.6
  beta: 0.03
  advance_m_day: 2.5
