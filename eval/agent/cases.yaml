# 智能体端到端评测用例。每个用例：场景 + 模拟时刻 + 对总指挥协调的提问 + 判定规则。
# approvals：人工确认时放行哪些 actions 工具（短名 → allow），没列出的一律拒绝；放行类用例要用 make dev-eval 启动。
# 规则含义见 eval/agent/grade.py 文件头。与 eval/expectations.yaml 一样，时刻和规则都是开发占位，待专家审定。

- id: s2-assess-1201
  description: 缓慢氧化阶段请求研判（验证清单 #8、#16 的同一问题）
  scenario: s2-slow-oxidation
  at_h: 48 # 场景开始后第 48 模拟小时；评测期间模拟时钟冻结
  prompt: 请研判 1201 工作面
  checks:
    expect_decisions:
      status: placeholder
      derived_from: {scenario: s2-slow-oxidation, at_h: 48, level: none, stage: slow_oxidation, recommend_escalation: false, realtime_alarms: 0}
      external_actions:
        required: {}
        optional: {}
      flows_called: [run_fire_assessment]
    explanation_generated: true
    no_wait_polling: true # 等子 Agent 结果时不轮询（不委派的用例自然通过，用于防回退）
    tools_called: [run_fire_assessment] # 标准研判走固定流程，不再委派 rescue-assessment
    facts_reported: true
    no_actions: true
    numbers_grounded: true
    cited_tools_called: true
    stage_reported: true

- id: s2-effect-after-inerting
  description: 注氮加堵漏 24 小时后请求效果评估（第 2 阶段；场景设计的结论是“需继续处置”）
  scenario: s2-slow-oxidation
  apply: # 与 eval/expectations.yaml 同格式；第一次处置的矿井时间填入提问的 {since}
    - {at_h: 48, type: inert_injection, params: {rate_m3_h: 1000}}
    - {at_h: 48, type: leak_sealing, params: {reduction: 0.5}, roadways: [R-1201-RET]}
  at_h: 72
  prompt: 1201 工作面自 {since} 起开始注氮并封堵回风侧漏风，请评估处置效果
  checks:
    expect_decisions:
      status: placeholder
      derived_from: {scenario: s2-slow-oxidation, effect: continuing}
      external_actions:
        required: {}
        optional: {}
      flows_called: [review_effect]
    no_wait_polling: true # 等子 Agent 结果时不轮询（不委派的用例自然通过，用于防回退）
    tools_called: [review_effect] # 效果评估走固定流程
    facts_reported: true
    no_actions: true
    numbers_grounded: true
    cited_tools_called: true
    effect_reported: true

- id: s4-escalate-1201
