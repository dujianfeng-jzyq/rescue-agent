- id: v3-reignition-reseal
  description: 启封后复燃（s5 第 240 小时提前启封，第 312 小时 CO 持续上升）：监听器唤醒后直接研判，reseal_indicated 为真则起草重新封闭方案并提交（放行），不先问人、不再提交启封
