[project]
name = "rescue-dispatch"
version = "0.1.0"
description = "物资调度服务"
requires-python = ">=3.12"
dependencies = ["rescue-contract", "networkx>=3.3"]

[project.scripts]
rescue-dispatch = "rescue_dispatch.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_dispatch"]
