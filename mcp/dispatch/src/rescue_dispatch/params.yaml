# 物资用量估算参数。全部是开发占位值，不代表本矿取值。
# TODO(专家): 由救护队和防灭火专业按本矿密闭设计、注浆工艺和材料规格确定。

seal:
  # 巷道断面（m²）。网络数据没有断面时使用；有图纸断面后改为按巷道取值
  default_section_m2: 12.0
  permanent:
    wall_thickness_m: 0.8          # 永久密闭墙厚
    bricks_per_m3: 512             # 标准砖用量（块/m³ 砌体）
    mortar_m3_per_m3: 0.24         # 砂浆用量（m³/m³ 砌体）
    cement_kg_per_m3_mortar: 404   # 1:3 水泥砂浆
    sand_m3_per_m3_mortar: 1.02
  temporary:
    kits_per_wall: 1               # 每道临时密闭用快速密闭材料（套）

grout:
  # 注浆量 = 采空区长 × 宽 × 采高 × 注浆系数；干料体积 = 浆液体积 ÷ (水土比 + 1)；干料质量 = 干料体积 × 堆积密度
  mining_height_m: 3.0
  coefficient: 0.05                # 注浆系数（浆液充填采空区体积的比例）
  water_soil_ratio: 5              # 浆液水土体积比 5:1
  bulk_density_t_m3: 1.5           # 黄泥/粉煤灰堆积密度
