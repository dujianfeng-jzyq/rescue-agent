# 采空区自燃预警分级阈值（演示用占位值）
#
# TODO(专家): 按客户矿井的《自然发火预测预报制度》和煤层标志气体临界值替换。
# 格雷哈姆系数的分级参照常用文献值（<0.4 正常；0.5 需关注；1.0 严重；2.0 活跃燃烧；>3 明火），需专家确认。
# 每一级满足任一条件即触发；取满足条件的最高级别。

blue:
  uc_co_ppm: 10          # 上隅角 CO
  tube_co_ppm: 40        # 束管 CO（任一测点）
  tube_co_rate_ppm_h: 1  # 束管 CO 近 12 小时上升速率
yellow:
  uc_co_ppm: 18
  tube_co_ppm: 80
  graham_ratio: 0.5
orange:
  uc_co_ppm: 24
  tube_co_ppm: 200
  c2h4_ppm: 0.3          # 乙烯出现
  graham_ratio: 1.0
red:
  tube_co_ppm: 1000
  c2h4_ppm: 2.0
  c2h2_ppm: 0.1          # 乙炔出现
  graham_ratio: 2.0

# ── 自燃发展阶段（与预警等级独立判定；演示用占位值）────────────────────────
# TODO(专家): 按本矿煤样程序升温实验的标志气体出现条件替换。
# 自高到低判定，满足该阶段任一条件即是该阶段；束管 CO 不可用时为 unknown。
stage:
  intense:                 # 激烈氧化，接近明火：乙炔检出
    c2h2_ppm: 0.05
  accelerating:            # 加速氧化：乙烯检出
    c2h4_ppm: 0.05
  slow_oxidation:          # 缓慢氧化：束管 CO 偏高或持续上升
    tube_co_ppm: 25
    tube_co_rate_ppm_h: 0.2

# ── 处置效果评估（演示用占位值）────────────────────────────────────────────
# TODO(专家): 观测周期按本矿取样制度确定；“明显减缓”的比例需审定。
effect:
  baseline_h: 12           # 处置前取多长时间算“处置前速率”
  min_observe_h: 12        # 处置后至少观测这么久才下结论（一个完整观测周期）
  review_interval_h: 12    # 总体评估给出的下次复评时刻 = 现在 + 此值
  controlled_rate: 0.0     # 处置后上升速率 ≤ 此值：停止上升（已受控）
  slowdown_ratio: 0.5      # 处置后速率 ≤ 处置前 × 此值：明显减缓（需继续处置）
  # 只评估“上升即变坏”的发火指标；O2、CH4、N2 等不适用（O2 下降、采空区 CH4 波动不说明火情好坏）
  # flat_rate：|速率| 小于此值按“不变”处理（每小时，单位同该参数），避免把噪声判成上升或回落
  flat_rate:
    CO: 0.01               # ppm/h
    TEMP: 0.01             # ℃/h
    C2H4: 0.001            # ppm/h
    C2H2: 0.001            # ppm/h
    CO2: 0.001             # %/h
