[project]
name = "rescue-fire-model"
version = "0.1.0"
description = "火灾专业计算服务"
requires-python = ">=3.12"
dependencies = ["rescue-contract", "pyyaml>=6"]

[project.scripts]
rescue-fire-model = "rescue_fire_model.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_fire_model"]
