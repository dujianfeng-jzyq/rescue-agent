[project]
name = "rescue-fire-sim"
version = "0.1.0"
description = "外部火灾推演服务（MineFireSimulation）的适配服务：火灾蔓延第二意见（docs/design-v7-fire-sim.md）"
requires-python = ">=3.12"
dependencies = ["rescue-contract"]

[project.scripts]
rescue-fire-sim = "rescue_fire_sim.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_fire_sim"]
