[project]
name = "rescue-actions"
version = "0.1.0"
description = "指令发布服务（需人工确认）"
requires-python = ">=3.12"
dependencies = ["rescue-contract"]

[project.scripts]
rescue-actions = "rescue_actions.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_actions"]
