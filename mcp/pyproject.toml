# uv 工作区：数据契约 + MCP 服务器（mine-data、actions）。
#   uv sync                       安装全部
#   uv run pytest                 运行全部测试
#   uv run python -m rescue_contract.conformance <URL>   对 mine-data 服务做一致性检查
[project]
name = "rescue-mcp-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rescue-contract",
    "rescue-mine-data-sim",
    "rescue-actions",
    "rescue-sentinel",
    "networkx>=3.3",   # 技能脚本的依赖（skills/requirements.txt）
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contract", "mine-data-sim", "actions", "sentinel"]

[tool.uv.sources]
rescue-contract = { workspace = true }
rescue-mine-data-sim = { workspace = true }
rescue-actions = { workspace = true }
rescue-sentinel = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["contract/tests", "mine-data-sim/tests", "actions/tests", "sentinel/tests", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM117"]
