# 本地留存的红线相关条款，以及技能和红线自查固定引用的条款（降级用，也用于免检索直接引用）。
#
# RAGFlow 由其他部门运维；它不可用时，合规校验和条款引用不能跟着失效，所以红线规则涉及的条款在此留存。
# 文本为要点摘录，不是规程全文。正式引用以规程原文为准。
# TODO(专家): 逐条与《矿山救援规程》（应急管理部令第16号）原文核对；接入客户矿井后补充本矿预案中的强制性要求。

- document: 矿山救援规程
  article: 第39条
  tags: [先期处置, 撤人, 自救器]
  text: 事故发生后，涉险区域人员应在安全条件下积极抢救人员和控制灾情并立即上报；不具备条件的立即撤离至安全地点，撤离时根据需要使用自救器，撤离受阻时紧急避险待救。
- document: 矿山救援规程
  article: 第40条
  tags: [调度员, 通知, 报告]
  text: 值班调度员接到事故报告后，应立即通知涉险区域人员撤离险区，报告矿山企业负责人，通知矿山救援队、医疗急救机构和有关人员到现场救援。
- document: 矿山救援规程
  article: 第46条
  tags: [行动方案, 带队指挥员, 职责]
  # 取自演示知识库（RAGFlow，矿山救援规程.pdf，2026-11-02）原文，去掉了 PDF 换行；待与正式文本核对
  text: 矿山救援队带队指挥员应当根据应急救援方案和事故情况，组织制定矿山救援队行动方案和安全保障措施；执行灾区探察和救援任务时，应当至少有1名中队或者中队以上指挥员在现场带队。
- document: 矿山救援规程
  article: 第53条
  tags: [待机小队]
  text: 矿山救援队组织救援小队执行矿井灾区探察和救援任务时，应当设立待机小队。
- document: 矿山救援规程
  article: 第57条
  tags: [进入灾区, 人数]
  text: 救援小队进入矿井灾区探察或者救援，应急救援人员不得少于6人，并携带灾区探察基本装备。
- document: 矿山救援规程
  article: 第73条
  tags: [火灾, 灾情, 了解情况]
  text: 参加矿井火灾救援应了解：火灾类型、发火时间、火源位置、火势及烟雾、波及范围、遇险人员分布和安全避险系统；有毒有害气体、温度、通风系统状态、风流方向和风量、矿尘爆炸性；顶板和支护；灾区供电；供水管路和消防器材；火灾专项应急预案及实施状况。
- document: 矿山救援规程
  article: 第75条
  tags: [甲烷, 撤出, 风流逆转]
  text: 火灾救援中指定专人检测瓦斯和矿尘、观测气体和风流变化；甲烷浓度超过2%并且继续上升、风量突然发生较大变化或风流出现逆转征兆时，应立即撤到安全地点。
- document: 矿山救援规程
  article: 第77条
  tags: [反风, 风流短路, 撤人]
  text: 可根据灾情采取局部反风、全矿井反风、风流短路、停止通风或减少风量等措施，并防止瓦斯积聚和风流紊乱；采取反风或风流短路措施前，必须将原进风侧人员或受影响区域内人员撤到安全地点。
- document: 矿山救援规程
  article: 第79条
  tags: [用水灭火, 条件]
  text: 用水灭火应当具备：火源明确；水源、人力和物力充足；回风道畅通；甲烷浓度不超过2%。
- document: 矿山救援规程
  article: 第84条
  tags: [隔绝灭火, 临时密闭, 永久密闭]
  text: 封闭火区时首先建造临时密闭，经观测风向、风量、烟雾和气体分析，确认无爆炸危险后，再建造永久密闭或防爆密闭。
- document: 矿山救援规程
  article: 第85条
  tags: [封闭火区, 惰性气体, 抑爆]
  text: 封闭有爆炸危险火区时，先采取注入惰性气体等抑爆措施，后在安全位置构筑进、回风密闭；封闭过程中发现瓦斯等易燃易爆气体浓度迅速增加时，所有人员立即撤到安全地点。
- document: 矿山救援规程
  article: 第86条
  tags: [密闭, 位置, 封闭火区]
  # 取自演示知识库（RAGFlow，矿山救援规程.pdf，2026-11-02）原文，去掉了 PDF 换行；待与正式文本核对
  text: 建造火区密闭应当遵守下列规定：（一）密闭墙的位置选择在围岩稳定、无破碎带、无裂隙和巷道断面较小的地点，距巷道交叉口不小于10米；（二）拆除或者断开管路、金属网、电缆和轨道等金属导体；（三）密闭墙留设观测孔、措施孔和放水孔。
- document: 矿山救援规程
  article: 第87条
  tags: [火区封闭后, 24小时, 密闭破坏]
  text: 火区封闭后所有人员立即撤出危险区；进入检查或加固密闭墙在24小时后进行；火区密闭被爆炸破坏的，严禁派救援队探察或恢复密闭，须采取惰化等措施并经检测无爆炸危险后方可作业。
- document: 矿山救援规程
  article: 第88条
  tags: [高温, 浓烟, 能见度]
  text: 巷道温度超过30℃控制佩用氧气呼吸器持续作业时间，超过40℃不得佩用氧气呼吸器作业（抢救人员时严格限制作业时间）；严禁进入烟雾弥漫至能见度小于1米的巷道。
- document: 矿山救援规程
  article: 第98条
  tags: [采空区, 冒落带, 通风稳定]
  text: 采空区或者巷道冒落带发生火灾，应当保持通风系统稳定，检查与火区相连的通道，防止瓦斯涌入火区。
- document: 矿山救援规程
  article: 第164条
  tags: [启封, 复燃]
  text: 封闭火区符合启封条件后方可启封。启封前检查温度、气体浓度和支护，切断回风流电源，撤出回风侧人员；启封时锁风、逐段恢复通风，发现复燃征兆立即重新封闭；启封后3日内每班检查，确认火区完全熄灭后方可结束。
