[project]
name = "rescue-kb"
version = "0.1.0"
description = "知识检索封装层（RAGFlow）"
requires-python = ">=3.12"
dependencies = ["rescue-contract", "pyyaml>=6"]

[project.scripts]
rescue-kb = "rescue_kb.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_kb"]
