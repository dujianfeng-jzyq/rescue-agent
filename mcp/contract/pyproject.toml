[project]
name = "rescue-contract"
version = "0.1.0"
description = "数据契约、红线规则引擎和 MCP 服务公共设施"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
    "uvicorn>=0.34",
    "starlette>=0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_contract"]
