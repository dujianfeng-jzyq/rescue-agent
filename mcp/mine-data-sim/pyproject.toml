[project]
name = "rescue-mine-data-sim"
version = "0.1.0"
description = "模拟矿井 mine-data 服务"
requires-python = ">=3.12"
dependencies = ["rescue-contract", "pyyaml>=6"]

[project.scripts]
rescue-mine-data-sim = "rescue_mine_data_sim.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_mine_data_sim"]
