[project]
name = "rescue-ventnet"
version = "0.1.0"
description = "通风网络分析服务"
requires-python = ">=3.12"
dependencies = ["rescue-contract", "networkx>=3.3"]

[project.scripts]
rescue-ventnet = "rescue_ventnet.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_ventnet"]
