[project]
name = "rescue-sentinel"
version = "0.1.0"
description = "常驻监听器：不经模型，按矿井时钟检测、去重、写事件库"
requires-python = ">=3.12"
dependencies = ["rescue-contract"]

[project.scripts]
rescue-sentinel = "rescue_sentinel.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_sentinel"]
