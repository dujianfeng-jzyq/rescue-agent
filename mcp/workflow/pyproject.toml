[project]
name = "rescue-workflow"
version = "0.1.0"
description = "工作流服务：研判快照、效果评估、升级建议、方案草案、调度草案、值守（确定性流程，不经过大模型）"
requires-python = ">=3.12"
dependencies = ["rescue-contract", "rescue-fire-model", "rescue-ventnet", "rescue-dispatch", "rescue-kb", "pyyaml>=6"]

[project.scripts]
rescue-workflow = "rescue_workflow.__main__:main"

[tool.uv.sources]
rescue-contract = { workspace = true }
rescue-fire-model = { workspace = true }
rescue-ventnet = { workspace = true }
rescue-dispatch = { workspace = true }
rescue-kb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_workflow"]
