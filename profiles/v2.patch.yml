# 第二版主预设（草稿，docs/design-v2.md 4.1，ADR 0007）。P4 之前是可选叠加，不进 bundle：
#
#   scripts/dev.sh --v2          （等价于 dsh rescue --no-open --patch profiles/v2.patch.yml）
#
# 按 id 覆盖总指挥预设 rescue-commander；第一版的 rescue-plan、rescue-compliance 预设仍在（P3 后移除）。
# P1：证据插件的 check_mine（一次性检测）、get_record、export_record，固定流程 run_fire_assessment，以及 actions；
# 封闭方案、复评、持续检测、知识库插件在 P2–P4 加，persona 随之补充。
#
# 令牌（.env.example）：证据插件用 mine_data 只读令牌，actions 用 actions 令牌；DSH 不拿 /sim 控制令牌。
- id: preset-rescue-commander
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: rescue-commander
    name: 总指挥协调
    description: 接收报警和提问，调用固定流程和技能，提交需人工确认的指令（第二版）
    order: 10
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: |-
            你是煤矿采空区自燃应急救援的总指挥协调助手，服务于调度员、通风部门、总工程师和应急指挥部。

            工作方式：
            - “现在矿井是否有异常”调 check_mine（mode=once）；研判工作面、问预警等级、要不要升级、有没有爆炸危险，调 run_fire_assessment。其余按技能处理。
            - 典型场景调用固定流程工具，不要自己拼步骤，也不要在沙箱里重复它已经算过的内容。其他工具返回的报告事实部分原样放进回答，不改写、不删减、不重排；你只在后面写“分析与建议”，只引用报告里已有的数值。
            - run_fire_assessment、check_mine 返回的 report_markdown 原样单独成段放进回答（含风险图，不要改写路径）。
              run_fire_assessment 的报告里已有“研判说明”（关注点和下一步），报告文件和风险图也已交付（不要再调 present）；
              贴完报告就结束回答，不要再另写分析与建议或复述要点；用户追问时再补充。
            - 计算结果以记录为准：记录编号形如 EV-…（证据）、RS-…（结果）、RP-…（报告），用 get_record 读取。发布预警、下发方案、升级响应时引用记录编号，actions 会按记录核对，对不上就拒绝。
            - 需要在记录基础上做进一步分析时，可以用 export_record 把记录导出到工作区，按技能用 bash 在沙箱里运行技能脚本试算。沙箱里算出的结果只作参考：回答里要注明“试算，仅供参考”，不能作为指令依据。
            - bash 和文件工具只在会话工作区里使用。不要申请提权（不要用 workspace-write 以外的沙箱权限重试），不要读取工作区以外的配置、密钥或日志文件。
            - 需要发布的指令（预警等级、防灭火方案、升级应急响应、补充撤人名单、调度单、封闭方案、启封）一律通过 actions 工具提交，每次提交都会弹出人工确认。指令被拒绝时，照实转告拒绝原因和条号，不要绕过，不要换个说法重复提交。
            - 方案里需要人确认的现场条件（灾区温度、能见度、火源是否明确、水源是否充足、回风道是否畅通）不要替人填写；固定流程缺这些输入时会返回问题清单，用 ask_user 问指挥人员，带着回答重新运行。
            - 有实时红线报警时，在回答开头立即、置顶提示。一旦进入应急响应，提醒调度员按预案立即撤人，撤人不等待你的任何结果；你给出的撤人名单只是补充。
            - 收到后台任务结束的通知时，用 job_output 读一次结果再处理；后台任务被用户停止时，简要确认即可。不要轮询任何工具等待。

            通用规则：
            - 你提供辅助决策建议，决策和指令由人作出。不要声称已经执行了任何处置。
            - 所有数值（浓度、温度、预警等级、到达时间、用量、距离，以及人数合计、变化量、时长、条数）只能来自工具或记录，照抄并注明来源；不得估算或编造，也不要自己计数、加减或归纳界限（如“均超过 23 ℃”），需要汇总结论时用工具给出的汇总字段。
            - 多个测点的数值逐个照抄原值，不要取整、加“约”“左右”、合并成区间。
            - “现在”以记录里的矿井时间（as_of）为准，不使用系统时间。
            - 数据缺失或被判为可疑时，明确说明缺什么、对结论有什么影响；不确定时写“需人工判断”。
            - 引用规程时，只引用工具给出的条文，照抄文档名和条号；不要凭记忆引用。
            - 用中文回答，先给结论，再给依据。
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          includeDefaultRoots: false
          # 第二版技能在 skills/<技能名>/；第一版的 skills/<角色>/<技能>/ 不会被这一层扫描到
          customSkillDirs: !!js "[`${process.env.RESCUE_HOME}/skills`]"
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
        config:
          maxConsecutiveWakes: 3      # 占位：防止“唤醒 → 再启动 → 再唤醒”的循环（4.9）
      # 预设里提供的服务必须放在隔离域里（DSH：Preset services require isolate realms）。
      # 证据插件提供服务 rescueEvidence；以后的固定流程插件放进同一组，才能注入它。
      - id: rescue
        name: cordis:group
        group: true
        isolate:
          rescueEvidence: true
        config:
          - id: rescue-evidence
            name: '@rescue/dsh-bundle/evidence'
            config:
              mineDataUrl: !!js "process.env.RESCUE_MCP_MINE_DATA_URL ?? 'http://127.0.0.1:8101/mcp'"
              mineDataToken: !!js "process.env.RESCUE_MCP_MINE_DATA_TOKEN || process.env.RESCUE_MCP_TOKEN || undefined"
              skillsDir: !!js "`${process.env.RESCUE_HOME}/skills`"
              recordDir: !!js "process.env.RESCUE_RECORD_DIR || `${process.env.RESCUE_HOME}/var/records`"
              # 运行技能脚本的解释器：要装有 skills/requirements.txt 的包。Docker 里是镜像自带的 python3
              python: !!js "process.env.RESCUE_SKILL_PYTHON || `${process.env.RESCUE_HOME}/mcp/.venv/bin/python`"
          # 固定流程：进程内用 rescueEvidence，所以在同一组里
          - id: rescue-fire-loop
            name: '@rescue/dsh-bundle/fire-loop'
      - id: mcp-actions
        name: '@deepseek-ai/dsh-mcp-client'
        config:
          serverName: actions
          transport: streamable-http
          url: !!js "process.env.RESCUE_MCP_ACTIONS_URL ?? 'http://127.0.0.1:8106/mcp'"
          headers: !!js "((t) => t ? { Authorization: 'Bearer ' + t } : {})(process.env.RESCUE_MCP_ACTIONS_TOKEN || process.env.RESCUE_MCP_TOKEN)"
          toolCallTimeoutMs: 60000
          failOnStartupError: false
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 16384
              headChars: 8192
