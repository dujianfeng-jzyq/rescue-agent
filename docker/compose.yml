# 演示部署（docs/design-v2.md 7.2；第三版加监听器）。用 make demo-up 启动：它生成令牌（var/demo/tokens.env）、建好数据目录，再调 docker compose。
# 宿主机只映射两个端口：13080 网页端、13090 演示控制台（模拟矿井的 /console；它的 MCP 和 /sim/ 接口都要令牌）。
# 令牌按服务分开：DSH 只拿 mine_data 只读令牌和 actions 令牌，不拿 /sim 控制令牌（设计 7.1）。
name: rescue-demo

x-python: &python
  build: {context: .., dockerfile: docker/python.Dockerfile}
  image: rescue-demo-python
  restart: unless-stopped
  networks: [rescue]

services:
  mine-sim:
    <<: *python
    command: ["python", "-m", "rescue_mine_data_sim"]
    environment:
      RESCUE_SIM_MODE: demo                       # 启动即常态连续运行
      RESCUE_MCP_ALLOWED_HOSTS: "mine-sim:*"      # 容器之间按服务名访问 MCP（DNS 重绑定防护的白名单）
      RESCUE_SIM_SPEED: ${RESCUE_SIM_SPEED:-60}
      RESCUE_MCP_MINE_DATA_TOKEN: ${RESCUE_MCP_MINE_DATA_TOKEN:?}
      RESCUE_MCP_MINE_ACT_TOKEN: ${RESCUE_MCP_MINE_ACT_TOKEN:?}     # rescue-mine 写入类工具（通知、调度、处置）的令牌，只有 guard（actions 容器）持有
      RESCUE_SIM_CONTROL_TOKEN: ${RESCUE_SIM_CONTROL_TOKEN:?}
      RESCUE_RECORD_DIR: /data/records            # 只读：看到异常检测记录就自动暂停（只为演示）
      RESCUE_INCIDENT_DIR: /data/incidents        # 只读：监听器的告警自动暂停；控制台显示事件和监听器心跳
    volumes:
      - ../var/demo/records:/data/records:ro
      - ../var/demo/incidents:/data/incidents:ro
    ports: ["127.0.0.1:${DEMO_CONSOLE_PORT:-13090}:8101"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/healthz', timeout=3)"]
      interval: 5s
      retries: 20

  actions:
    <<: *python
    command: ["python", "-m", "rescue_actions"]
    environment:
      RESCUE_MCP_ACTIONS_TOKEN: ${RESCUE_MCP_ACTIONS_TOKEN:?}
      RESCUE_MCP_ALLOWED_HOSTS: "actions:*"
      RESCUE_MCP_MINE_DATA_TOKEN: ${RESCUE_MCP_MINE_DATA_TOKEN:?}   # 读矿井（时钟、人员、物资台账、回执）
      RESCUE_MCP_MINE_ACT_TOKEN: ${RESCUE_MCP_MINE_ACT_TOKEN:?}     # 经 rescue-mine 下发通知、调度、处置；guard 不持有模拟器控制令牌
      RESCUE_MCP_MINE_DATA_URL: http://mine-sim:8101/mcp
      RESCUE_RECORD_DIR: /data/records            # 只读：发布前按记录核对
      RESCUE_ACTIONS_LEDGER: /data/ledger/actions-ledger.jsonl
      RESCUE_INCIDENT_DIR: /data/incidents        # 对外动作的结果记进事件时间线
    volumes:
      - ../var/demo/records:/data/records:ro
      - ../var/demo/incidents:/data/incidents
      - ../var/demo/ledger:/data/ledger
    depends_on:
      mine-sim: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8106/healthz', timeout=3)"]
      interval: 5s
      retries: 20

  sentinel:                                       # 常驻监听器（第三版 P3）：不经模型，按矿井时钟检测、去重、写事件库
    <<: *python
    command: ["python", "-m", "rescue_sentinel"]
    environment:
      RESCUE_MCP_MINE_DATA_TOKEN: ${RESCUE_MCP_MINE_DATA_TOKEN:?}   # 只读令牌
      RESCUE_MCP_MINE_DATA_URL: http://mine-sim:8101/mcp
      RESCUE_INCIDENT_DIR: /data/incidents
      RESCUE_SKILLS_DIR: /app/skills
    volumes:
      - ../skills:/app/skills:ro
      - ../var/demo/incidents:/data/incidents
    healthcheck:   # 心跳文件（真实时间）新鲜且没有错误，才算监听器在正常监听
      test: ["CMD", "python", "-c", "import json,time; h=json.load(open('/data/incidents/sentinel/heartbeat.json')); assert time.time()-h['wall']<60 and not h.get('error'), h"]
      interval: 10s
      retries: 12
      start_period: 15s
    depends_on:
      mine-sim: {condition: service_healthy}

  dsh:
    build: {context: .., dockerfile: docker/dsh.Dockerfile}
    image: rescue-demo-dsh
    restart: unless-stopped
    networks: [rescue]
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?在 .env 里填写 DEEPSEEK_API_KEY}
      RESCUE_MCP_MINE_DATA_TOKEN: ${RESCUE_MCP_MINE_DATA_TOKEN:?}
      RESCUE_MCP_ACTIONS_TOKEN: ${RESCUE_MCP_ACTIONS_TOKEN:?}
      RESCUE_MCP_MINE_DATA_URL: http://mine-sim:8101/mcp
      RESCUE_MCP_ACTIONS_URL: http://actions:8106/mcp
      RESCUE_REDLINE_CHECK_URL: http://actions:8106/redlines/check
      RESCUE_RECORD_DIR: /data/records
      RESCUE_INCIDENT_DIR: /data/incidents        # 事件库：事件插件读写，唤醒插件扫描
      RESCUE_DUTY_CWD: /data/duty                 # 值班会话的工作目录
      RESCUE_RUN_DIR: /data/runs                  # 技能脚本的运行目录
      RESCUE_AUDIT_LOG: /data/audit/tool-actions.jsonl
      DSH_PUBLIC_PORT: ${DEMO_WEB_PORT:-13080}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      KB_DATASETS_REGULATIONS: ${KB_DATASETS_REGULATIONS:-}
      KB_DATASETS_PLANS: ${KB_DATASETS_PLANS:-}
      KB_DATASETS_CASES: ${KB_DATASETS_CASES:-}
    volumes:
      - ../skills:/app/skills:ro                  # 技能目录只读（子进程不在沙箱里，设计 7.1）
      - ../var/demo/records:/data/records
      - ../var/demo/incidents:/data/incidents
      - ../var/demo/duty:/data/duty
      - ../var/demo/runs:/data/runs
      - ../var/demo/audit:/data/audit
      - ../var/demo/dsh-home:/home/node/.dsh-home
      - ../var/demo/documents:/home/node/Documents
    ports: ["127.0.0.1:${DEMO_WEB_PORT:-13080}:3080"]
    depends_on:
      mine-sim: {condition: service_healthy}
      actions: {condition: service_healthy}
    healthcheck:
      # 网页端在监听，且能连到模拟矿井和 actions（证据插件、指令都靠它们）
      test: ["CMD", "/app/docker/dsh-health.sh"]
      interval: 10s
      retries: 30
      start_period: 20s

networks:
  rescue: {}
