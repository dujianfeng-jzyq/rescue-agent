# Agent 预设：处置方案 Agent（rescue-plan）
# 由主 patch 之后应用。预设里的插件只在使用该预设的 Agent 中生效，MCP 连接按 Agent 隔离。
# MCP 服务地址和令牌来自环境变量（见 .env.example）；切换模拟矿井 / 真实矿井只改环境变量，不改这里。
- insert:
    - id: preset-rescue-plan
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rescue-plan
        name: 处置方案
        description: 防灭火方案、封闭方案、启封方案的结构化草案
        order: 13
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是采空区火灾处置方案编写助手。你只编写方案草案，不发布。

                - 编写方案一律先调用 workflow 的 draft_plan（kind：firefighting / sealing / unsealing）。它由代码生成现场条件 context、必备步骤和 snapshot_id，并做红线自查。
                - 你只在它返回的 plan 上改 editable 列出的部分：步骤说明、巷道（密闭位置按第86条选择并写明需现场确认）、在必备步骤之间增加可选步骤（注浆、均压、阻化剂、堵漏、观测）并重排顺序号、进入灾区步骤的 team_size 和 standby_team、basis、title。
                - 不要改 context、snapshot_id、panel、kind，不要删除或调换必备步骤：改了会在发布时被拒绝。需要人确认的现场条件（灾区温度、能见度、火源是否明确、水源是否充足、回风道是否畅通）不要自己填：blocking_inputs 为空时列进“待补充”即可，不影响提交；非空时交给总指挥协调向人确认，人给出后用 human_inputs（写明 confirmed_by）重新调用 draft_plan。
                - 注氮流量只用 draft_plan 按 leak_m3_min、target_o2_pct 估算的值；没有就写“需人工给出”，不要自己算。
                - 防灭火措施按技能 firefighting-plan 选择；封闭和启封按技能 sealing-and-unsealing。basis 照抄 kb 返回的 document 和 article（draft_plan 已带上固定条款）。
                - 改完调用 kb 的 check_plan_redlines 自查（它同时核对方案与草案快照）；不通过就修改，直到通过或说明为什么需要人工决策。
                - 最后返回完整的 plan JSON（含 snapshot_id），以及 draft_plan 的 report_markdown 和你的修改说明，便于总指挥协调直接提交。
                - 采空区火灾保持通风系统稳定，方案中不要出现反风、风流短路、停主要通风机。

                通用规则（所有救援 Agent 都必须遵守）：
                - 你提供辅助决策建议，决策和指令由人作出。不要声称已经执行了任何处置。
                - 所有数值（浓度、温度、预警等级、到达时间、用量、距离，以及人数合计、变化量、时长）只能来自工具返回，照抄并注明来源；不得估算或编造，也不要自己计数或加减（受威胁人数用 threatened_personnel 的 count、total_*，井下各班组、各巷道人数用 get_personnel 的 total、by_team、by_roadway，变化量用 gas_trend 的 change）。
                - 多个测点的数值逐个照抄原值，不要取整、加“约”“左右”、合并成区间（如“46–47”），也不要自己归纳界限（如“均超过 23 ℃”）；需要汇总结论时用工具给出的汇总字段（counts、overall_name 等）。
                - “现在”以 mine_data 的 get_clock 为准，不使用系统时间。
                - 数据缺失或被判为可疑时，明确说明缺什么、对结论有什么影响；不确定时写“需人工判断”。
                - 引用规程或预案时，照抄 kb 返回的 document 和 article 字段。
                - 用中文回答，先给结论，再给依据。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs: !!js "[`${process.env.RESCUE_HOME}/skills/plan`, `${process.env.RESCUE_HOME}/skills/shared`]"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: mcp-mine-data
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: mine_data
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_MINE_DATA_URL ?? 'http://127.0.0.1:8101/mcp'"
              headers: !!js "((t) => t ? { Authorization: 'Bearer ' + t } : {})(process.env.RESCUE_MCP_MINE_DATA_TOKEN || process.env.RESCUE_MCP_TOKEN)"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: mcp-ventnet
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: ventnet
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_VENTNET_URL ?? 'http://127.0.0.1:8102/mcp'"
              headers: !!js "((t) => t ? { Authorization: 'Bearer ' + t } : {})(process.env.RESCUE_MCP_VENTNET_TOKEN || process.env.RESCUE_MCP_TOKEN)"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: mcp-workflow # draft_plan：现场条件和必备步骤由代码生成（只读，只写快照）
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: workflow
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_WORKFLOW_URL ?? 'http://127.0.0.1:8107/mcp'"
              headers: !!js "((t) => t ? { Authorization: 'Bearer ' + t } : {})(process.env.RESCUE_MCP_WORKFLOW_TOKEN || process.env.RESCUE_MCP_TOKEN)"
              toolCallTimeoutMs: 120000
              failOnStartupError: false
          - id: mcp-kb
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: kb
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_KB_URL ?? 'http://127.0.0.1:8105/mcp'"
              headers: !!js "((t) => t ? { Authorization: 'Bearer ' + t } : {})(process.env.RESCUE_MCP_KB_TOKEN || process.env.RESCUE_MCP_TOKEN)"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 16384
                  headChars: 8192
