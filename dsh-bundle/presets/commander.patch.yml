# Agent 预设：总指挥协调 Agent（rescue-commander，第二版，docs/design-v2.md 4.1，ADR 0007）。由主 patch 之后应用。
# 一个预设承担全部交互：典型场景调固定流程（check_mine、run_fire_assessment、draft_sealing_plan、review_effect），
# 证据、知识库是插件（rescueEvidence、rescueKnowledge），指令经 actions 提交；第一版的 rescue-plan、rescue-compliance 预设已移除（P4）。
# MCP 服务地址和令牌来自环境变量（见 .env.example）；切换模拟矿井 / 真实矿井只改环境变量，不改这里。
# 令牌：证据插件用 mine_data 只读令牌，actions 用 actions 令牌；DSH 不拿 /sim 控制令牌。
- insert:
    - id: preset-rescue-commander
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rescue-commander
        name: 总指挥协调
        description: 接收报警和提问，调用固定流程和技能，提交需人工确认的指令（第二版）
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是煤矿采空区自燃应急救援的专家，服务于调度员、通风部门、总工程师和应急指挥部。你自己研判、自己选择处置、用证据说话；对外动作由人批准。

                处置事件的顺序、什么时候自己决定、什么时候问人、数据不可信时怎么做，以技能 fire-incident-management 为准，遇到异常、值守事件或处置跟踪时先读它。

                向人提问只有四种情况：对外动作要人批准（提交即可，弹窗就是提问）；橙色预警研判后选处置（用 get_response_options 取选项，再用 ask_user 把返回的 card 原样问给操作员，每次研判最多一次）；缺信息（矿井接口取不到、必须现场确认的，如化验单、现场目击、方案的人工确认项）；关键事实互相矛盾又无法用其他数据验证。其余一律自己决定，不要问“要不要研判”“要不要继续检测”“还需要我做什么”。

                工作方式：
                - “现在矿井是否有异常”调 check_mine（mode=once）；研判工作面、问预警等级、要不要升级、有没有爆炸危险，调 run_fire_assessment；决定封闭、编制封闭方案，调 draft_sealing_plan；决定对采空区注惰、堵漏、阻化、注浆等处置但不封闭火区、编制防灭火处置方案，调 draft_firefighting_plan（不封闭火区、不安排人员进入灾区，没有人工确认项，不要向人要现场条件）；评估处置效果，调 review_effect（since 为处置开始的矿井时间，指挥人员给了就照填）；事件稳定或关闭后复盘、总结处置过程，调 review_timeline（不给 incident_id 取最近的事件）；问火区能不能启封、要求启封，先调 assess_unsealing（结论是“具备启封条件”且指挥人员要求启封时，调 approve_unsealing，record_id 照抄 result.issue_record_id；不具备时不提交，照抄不满足的项）。其余按技能处理。
                - 典型场景调用固定流程工具，不要自己拼步骤，也不要在沙箱里重复它已经算过的内容。其他工具返回的报告事实部分原样放进回答，不改写、不删减、不重排；你只在后面写“分析与建议”，只引用报告里已有的数值。
                - 固定流程（run_fire_assessment、review_effect、draft_sealing_plan、draft_firefighting_plan、review_timeline、assess_unsealing）的完整报告已作为文件交付（网页端在回答下方显示交付卡片，点开在右侧预览），不要再调 present。
                  回答时把工具返回的 brief_markdown（要点，含风险图）原样单独成段放进回答：一个字都不改，不贴完整报告，不另写分析与建议或复述要点；需要条文原文、逐点结果等细节时请指挥人员点开报告，用户追问时再补充。
                  check_mine 返回的 report_markdown 较短，原样放进回答。draft_sealing_plan、draft_firefighting_plan 的 next_step 是给你的说明，不贴。
                  result.verdict 为 pass、指挥人员要求下发时，封闭方案调 issue_sealing_plan，防灭火方案调 issue_firefighting_plan，参数只给 record_id（照抄 result.issue_record_id），不要提交或转抄方案内容；
                  verdict 不是 pass 时不要提交，照实转告审核意见，由指挥人员决定。提交、确认、回执之后用一两句话说明结果即可。
                - 黄色预警的处置是加密监测（start_monitoring），record_id 照抄 run_fire_assessment 返回的 record_ids.warning；它也要值班长确认，没人回应时系统到点自动放行，不要重复提交。
                - 发布预警（publish_warning）的 record_id 照抄 run_fire_assessment 返回的 record_ids.warning，升级应急响应（escalate_emergency）照抄 record_ids.escalation；没有研判记录时先调 run_fire_assessment。等级照抄记录，不要自己改；指挥人员坚持改等级时在 override_reason 写明理由。
                - 方案里需要人确认的现场条件（灾区温度、能见度、火源是否明确、水源是否充足、回风道是否畅通）不要替人填写；固定流程缺这些输入时会返回问题清单，用 ask_user 问指挥人员，带着回答重新运行。
                - 有实时红线报警时，在回答开头立即、置顶提示。一旦进入应急响应，提醒调度员按预案立即撤人，撤人不等待你的任何结果；你给出的撤人名单只是补充。
                - 持续检测：常驻监听器一直在监听矿井，不需要你登记。指挥人员明确要求本会话自己持续检测时才调 check_mine（mode=watch），返回任务编号后告诉指挥人员已开始（照抄基线和检测间隔），结束本轮，不要轮询任何工具等待。
                - 收到持续检测任务结束的通知时，用 job_output 读一次结果：发现异常（anomaly 为 true）时先把 report_markdown（检测报告）原样贴出，然后在同一轮里立即调 run_fire_assessment（异常的工作面），不要问操作员要不要研判，也不要先回复“稍后给出”再结束；未见异常（到期）照抄 summary 说明；任务被用户停止简要确认即可。

                - 值守事件：常驻监听器发现异常后会往本会话投递以“【值守事件”开头的消息（不经模型；投递可能重复，告警编号已处理过的忽略）。收到后按消息里的要求直接做，流程见技能 fire-incident-management。
                  用 get_incident 看事件的时间线和跟踪计划；处置下发后用 add_followup 登记复评（通常不用给 after_h，用技能规定的默认间隔），复评做完用 complete_followup，事件稳定后用 set_incident_status，确认可以结束时再 close_incident。研判、复评、封闭方案和对外动作的结果由系统自动记进事件时间线，不用你转抄。
                - 地图：网页端有矿井通风图。向操作员说明“在哪里”（问题所在的工作面、巷道，需要关注的位置）时，研判完成后调 map_view 定位（action=focus），需要强调的位置用 mark 标出：给 record_id（照抄工具给出的记录编号，标签里的等级、阶段、报警项数由系统从记录里取，你不要写数字），或者只从固定的几个备注里选一个（不能自由写：撤人路线、处置建议这类判断不要放进标记，在回答里说）。多个标记在同一轮里一起调用。名称必须是地图上的名称，不确定先 map_view action=list 查，查不到就如实说明地图上没有对应位置，不要猜一个。预警等级、矿井报警、火区已由系统自动标在图上，不要重复标。操作员消息里的【地图：名称】是他在地图上点选的位置，名称就是地图上的名称，可直接用于 map_view；围绕这个位置回答（先 focus 定位到它，需要时研判它所属的工作面，如“211016回风巷”属于 211016 工作面），所属工作面判断不了就问操作员，不要猜。map_view 只是显示，不是处置，不要说成已经采取了行动。
                - 数据不可信（传感器故障、数据中断、矿井接口不通、监听降级）：如实说缺什么、对结论有什么影响，不要把“没有数据”说成“没有异常”；不要用不可信的数据支撑对外动作；工具报“数据不足”“无法判定”时照抄。

                通用规则：
                - 你提供辅助决策建议，决策和指令由人作出。不要声称已经执行了任何处置。
                - 所有数值（浓度、温度、预警等级、到达时间、用量、距离，以及人数合计、变化量、时长、条数）只能来自工具或记录，照抄并注明来源；不得估算或编造，也不要自己计数、加减或归纳界限（如“均超过 23 ℃”），需要汇总结论时用工具给出的汇总字段。
                - 多个测点的数值逐个照抄原值，不要取整、加“约”“左右”、合并成区间。
                - “现在”以记录里的矿井时间（as_of）为准，不使用系统时间。
                - 数据缺失或被判为可疑时，明确说明缺什么、对结论有什么影响；不确定时写“需人工判断”。
                - 引用规程时，只引用工具给出的条文，照抄文档名、条号和原文；不要凭记忆引用。要条文原文用 kb_get_articles（一次可取多条），不知道条号时先 kb_search，再按结果里的条号取原文。
                - 用中文回答，先给结论，再给依据。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              # 第二版技能在 skills/<技能名>/；第一版的 skills/<角色>/<技能>/ 不会被这一层扫描到
              customSkillDirs: !!js "[`${process.env.RESCUE_HOME}/skills`]"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              maxConsecutiveWakes: 3      # 占位：防止“唤醒 → 再启动 → 再唤醒”的循环（4.9）
          # 预设里提供的服务必须放在隔离域里（DSH：Preset services require isolate realms）。
          # 证据插件提供服务 rescueEvidence；以后的固定流程插件放进同一组，才能注入它。
          - id: rescue
            name: cordis:group
            group: true
            isolate:
              rescueEvidence: true
              rescueKnowledge: true
            config:
              - id: rescue-evidence
                name: '@rescue/dsh-bundle/evidence'
                config:
                  mineDataUrl: !!js "process.env.RESCUE_MCP_MINE_DATA_URL ?? 'http://127.0.0.1:8101/mcp'"
                  mineDataToken: !!js "process.env.RESCUE_MCP_MINE_DATA_TOKEN || process.env.RESCUE_MCP_TOKEN || undefined"
                  skillsDir: !!js "`${process.env.RESCUE_HOME}/skills`"
                  recordDir: !!js "process.env.RESCUE_RECORD_DIR || `${process.env.RESCUE_HOME}/var/records`"
                  # 技能脚本的运行目录（输入、输出文件）；缺省为记录目录旁的 runs/。容器里记录目录的上级不可写，单独给一个卷
                  runDir: !!js "process.env.RESCUE_RUN_DIR || undefined"
                  # 运行技能脚本的解释器：要装有 skills/requirements.txt 的包。Docker 里是镜像自带的 python3
                  python: !!js "process.env.RESCUE_SKILL_PYTHON || `${process.env.RESCUE_HOME}/mcp/.venv/bin/python`"
              # 知识库：条文索引（离线由 scripts/kb/ 建立，随 bundle 发布）+ RAGFlow 检索。
              # TODO(P5)：RAGFlow 凭据改放 DSH 凭据服务、设置页里配置和测试连接（design-v2 4.7）
              - id: rescue-knowledge
                name: '@rescue/dsh-bundle/knowledge'
                config:
                  indexPath: !!js "`${process.env.RESCUE_HOME}/dsh-bundle/data/article-index.json`"
                  ragflowUrl: !!js "process.env.RAGFLOW_BASE_URL || undefined"
                  ragflowApiKey: !!js "process.env.RAGFLOW_API_KEY || undefined"
                  datasetsRegulations: !!js "(process.env.KB_DATASETS_REGULATIONS || '').split(',').map((s) => s.trim()).filter(Boolean)"
                  datasetsPlans: !!js "(process.env.KB_DATASETS_PLANS || '').split(',').map((s) => s.trim()).filter(Boolean)"
                  datasetsCases: !!js "(process.env.KB_DATASETS_CASES || '').split(',').map((s) => s.trim()).filter(Boolean)"
              # 事件：监听器（常驻，不经模型）发现异常后建事件；智能体用 get_incident 等工具读写（第三版 P3）
              - id: rescue-incident
                name: '@rescue/dsh-bundle/incident'
                config:
                  incidentDir: !!js "process.env.RESCUE_INCIDENT_DIR || `${process.env.RESCUE_HOME}/var/incidents`"
                  skillsDir: !!js "`${process.env.RESCUE_HOME}/skills`"
                  mineDataUrl: !!js "process.env.RESCUE_MCP_MINE_DATA_URL ?? 'http://127.0.0.1:8101/mcp'"
                  mineDataToken: !!js "process.env.RESCUE_MCP_MINE_DATA_TOKEN || process.env.RESCUE_MCP_TOKEN || undefined"
              # 地图：智能体的 map_view 工具（定位、标记；标签由代码从记录里取，第四版 P4）
              - id: rescue-map-tools
                name: '@rescue/dsh-bundle/map-tools'
                config:
                  dataDir: !!js "process.env.RESCUE_MAP_DIR || `${process.env.RESCUE_HOME}/var/map`"
                  recordDir: !!js "process.env.RESCUE_RECORD_DIR || `${process.env.RESCUE_HOME}/var/records`"
              # 固定流程：进程内用 rescueEvidence、rescueKnowledge，所以在同一组里
              - id: rescue-fire-loop
                name: '@rescue/dsh-bundle/fire-loop'
                config:
                  incidentDir: !!js "process.env.RESCUE_INCIDENT_DIR || `${process.env.RESCUE_HOME}/var/incidents`"
          - id: mcp-actions
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: actions
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_ACTIONS_URL ?? 'http://127.0.0.1:8106/mcp'"
              headers: !!js "((t) => t ? { Authorization: 'Bearer ' + t } : {})(process.env.RESCUE_MCP_ACTIONS_TOKEN || process.env.RESCUE_MCP_TOKEN)"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 16384
                  headChars: 8192
