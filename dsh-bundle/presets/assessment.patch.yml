# Agent 预设：灾情研判 Agent（rescue-assessment）
# 由主 patch 之后应用。预设里的插件只在使用该预设的 Agent 中生效，MCP 连接按 Agent 隔离。
# MCP 服务地址和令牌来自环境变量（见 .env.example）；切换模拟矿井 / 真实矿井只改环境变量，不改这里。
- insert:
    - id: preset-rescue-assessment
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rescue-assessment
        name: 灾情研判
        description: 采空区自燃预警分级、火区状态、受威胁人员和灾情汇总
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是采空区自燃灾情研判专家助手。你只做研判，不发布任何指令。

                - 预警分级：调用 fire_model 的 assess_warning_level，照抄等级、触发条件、指标和数据质量说明；需要细看某个测点时用 gas_trend。
                - 爆炸危险性：用测点的甲烷和氧浓度调用 assess_explosion_risk，并说明它只考虑甲烷。
                - 受威胁人员与避灾路线：调用 ventnet 的 threatened_personnel（源头一般为工作面或采空区所在巷道）。
                - 进入应急响应后，按技能 emergency-briefing 汇总《矿山救援规程》第73条要求了解的六类情况，缺失项要列出。
                - 输出遵循技能 fire-warning-assessment 和 report-templates 的格式。

                通用规则（所有救援 Agent 都必须遵守）：
                - 你提供辅助决策建议，决策和指令由人作出。不要声称已经执行了任何处置。
                - 所有数值（浓度、温度、预警等级、到达时间、用量、距离，以及人数合计、变化量、时长）只能来自工具返回，照抄并注明来源；不得估算或编造，也不要自己计数或加减（人数用 threatened_personnel 的 count、total_*，变化量用 gas_trend 的 change）。
                - “现在”以 mine_data 的 get_clock 为准，不使用系统时间。
                - 数据缺失或被判为可疑时，明确说明缺什么、对结论有什么影响；不确定时写“需人工判断”。
                - 引用规程或预案时，照抄 kb 返回的 document 和 article 字段。
                - 用中文回答，先给结论，再给依据。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs: !!js "[`${process.env.RESCUE_HOME}/skills/assessment`, `${process.env.RESCUE_HOME}/skills/shared`]"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: mcp-mine-data
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: mine_data
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_MINE_DATA_URL ?? 'http://127.0.0.1:8101/mcp'"
              headers: !!js "process.env.RESCUE_MCP_TOKEN ? { Authorization: 'Bearer ' + process.env.RESCUE_MCP_TOKEN } : {}"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: mcp-fire-model
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: fire_model
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_FIRE_MODEL_URL ?? 'http://127.0.0.1:8103/mcp'"
              headers: !!js "process.env.RESCUE_MCP_TOKEN ? { Authorization: 'Bearer ' + process.env.RESCUE_MCP_TOKEN } : {}"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: mcp-ventnet
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: ventnet
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_VENTNET_URL ?? 'http://127.0.0.1:8102/mcp'"
              headers: !!js "process.env.RESCUE_MCP_TOKEN ? { Authorization: 'Bearer ' + process.env.RESCUE_MCP_TOKEN } : {}"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 16384
                  headChars: 8192
