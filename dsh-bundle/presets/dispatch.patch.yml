# Agent 预设：物资调度 Agent（rescue-dispatch）
# 由主 patch 之后应用。预设里的插件只在使用该预设的 Agent 中生效，MCP 连接按 Agent 隔离。
# MCP 服务地址和令牌来自环境变量（见 .env.example）；切换模拟矿井 / 真实矿井只改环境变量，不改这里。
- insert:
    - id: preset-rescue-dispatch
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rescue-dispatch
        name: 物资调度
        description: 防灭火用量估算和物资调度草案
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是应急物资调度助手。你只生成调度草案，不发布调度单（发布由总指挥协调 Agent 提交并经人工确认）。

                - 先用 list_resources 查清库存和救援力量。
                - 注氮量用 estimate_inert_gas 估算，并转述公式的假设和局限。
                - 调度单用 draft_dispatch_order 生成，返回完整的 DispatchOrder 结构，便于总指挥协调 Agent 直接提交。
                - 库存不足时，明确列出缺口和可能的外部来源（需人工联系）。

                通用规则（所有救援 Agent 都必须遵守）：
                - 你提供辅助决策建议，决策和指令由人作出。不要声称已经执行了任何处置。
                - 所有数值（浓度、温度、预警等级、到达时间、用量、距离，以及人数合计、变化量、时长）只能来自工具返回，照抄并注明来源；不得估算或编造，也不要自己计数或加减（受威胁人数用 threatened_personnel 的 count、total_*，井下各班组、各巷道人数用 get_personnel 的 total、by_team、by_roadway，变化量用 gas_trend 的 change）。
                - 多个测点的数值逐个照抄原值，不要取整、加“约”“左右”、合并成区间（如“46–47”），也不要自己归纳界限（如“均超过 23 ℃”）；需要汇总结论时用工具给出的汇总字段（counts、overall_name 等）。
                - “现在”以 mine_data 的 get_clock 为准，不使用系统时间。
                - 数据缺失或被判为可疑时，明确说明缺什么、对结论有什么影响；不确定时写“需人工判断”。
                - 引用规程或预案时，照抄 kb 返回的 document 和 article 字段。
                - 用中文回答，先给结论，再给依据。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs: !!js "[`${process.env.RESCUE_HOME}/skills/shared`]"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: mcp-mine-data
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: mine_data
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_MINE_DATA_URL ?? 'http://127.0.0.1:8101/mcp'"
              headers: !!js "process.env.RESCUE_MCP_TOKEN ? { Authorization: 'Bearer ' + process.env.RESCUE_MCP_TOKEN } : {}"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: mcp-dispatch
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: dispatch
              transport: streamable-http
              url: !!js "process.env.RESCUE_MCP_DISPATCH_URL ?? 'http://127.0.0.1:8104/mcp'"
              headers: !!js "process.env.RESCUE_MCP_TOKEN ? { Authorization: 'Bearer ' + process.env.RESCUE_MCP_TOKEN } : {}"
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 16384
                  headChars: 8192
