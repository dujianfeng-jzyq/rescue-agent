# 煤矿应急救援 bundle 主 patch。
#
# 层叠顺序：dsh-base → dsh-web-app → 本 bundle（含 presets/*.patch.yml）→ 用户 profile patch → --patch 叠加层。
# 顶层 `- id: xxx` 是按 id 覆盖已有行（会整体替换该行的 config）；`- insert:` 是新增行。
# 依赖的环境变量见仓库根目录 .env.example。

# ── 1. 审批策略固定为 ask ─────────────────────────────────────────────────
# dsh-base 会在 DSH_PERMISSION_MODE=danger-full-access 时把策略改成 never（自动拒绝一切需确认的操作）。
# 救援场景下人工确认不能被环境变量关掉，这里写死。
- id: approval
  config:
    policy: ask

# 权限预设（网页端输入框的权限选择器）同理：DSH 自带的 Full access 预设审批为 never，
# 选中后 actions 的指令一律被自动拒绝，审计里又与真人拒绝无法区分（见验证清单）。只保留审批为 ask 的预设。
# defaultPreset 必须显式给出：export DSH_PERMISSION_MODE=danger-full-access 时沙箱默认值与任何预设都不匹配，
# 不写会导致本插件启动失败、网页端没有权限选择器。
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
    defaultPreset: workspace-write

# 模型请求的重试：在默认可重试错误之外加上 STREAM_CLOSED（“stream ended before message_stop”）。
# 默认不重试它，持续检测唤醒的这一轮会因此以 error 结束、异常送不到人（验证清单 #20、#23）。
# 重试发生在模型输出完整之前，工具还没执行，不会重复执行工具。maxRetries 为占位值。
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 3
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, STREAM_CLOSED]

# ── 2. 默认预设改为总指挥协调 Agent，并关闭 DSH 自带的编程类预设 ─────────────
# 自带预设带有 bash、文件读写等工具，不应出现在救援系统里。
# 验证项：若某个 DSH 版本里这些行 id 不存在，--dump-config 会提示未匹配，按提示删除对应行即可。
- id: agent-preset-registry
  config:
    default: rescue-commander
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: preset-ptc
  disabled: true

# ── 3. 本项目的原生插件 ────────────────────────────────────────────────────
- insert:
    - id: rescue-approval
      name: '@rescue/dsh-bundle/approval'
      config:
        gatedServer: actions
        # 哪些工具弹确认由动作分级表决定（data/action-policy.json，契约 rescue_contract.action_policy 导出）：C 级弹确认，A、B 级不弹；未登记按 C 级
        precheckUrl: !!js "process.env.RESCUE_REDLINE_CHECK_URL ?? 'http://127.0.0.1:8106/redlines/check'"
        precheckTimeoutMs: 5000
        token: !!js "process.env.RESCUE_MCP_ACTIONS_TOKEN || process.env.RESCUE_MCP_TOKEN"   # actions 的令牌（预检接口）
        incidentDir: !!js "process.env.RESCUE_INCIDENT_DIR || `${process.env.RESCUE_HOME ?? process.cwd()}/var/incidents`"   # 人工确认的等待和结果记进事件时间线（批准超时升级）

    # 三维地图（docs/design-v4-map.md，验证中）：Node 侧提供几何与指令推送，浏览器侧由 package.json 的 dsh.client 声明（lib/client.js）。
    # 宿主只把包根名称（@rescue/dsh-bundle）的入口当客户端包扫描，带子路径的入口不算，且同一个包只能有一个入口（验证清单 #25）。
    - id: rescue-map
      name: '@rescue/dsh-bundle'
      config:
        dataDir: !!js "process.env.RESCUE_MAP_DIR || `${process.env.RESCUE_HOME ?? process.cwd()}/var/map`"   # 地图包目录（真实矿井图不进仓库）
        # 大屏左右栏的数据来源（只读）：事件库、记录目录、矿井数据服务
        incidentDir: !!js "process.env.RESCUE_INCIDENT_DIR || `${process.env.RESCUE_HOME ?? process.cwd()}/var/incidents`"
        recordDir: !!js "process.env.RESCUE_RECORD_DIR || `${process.env.RESCUE_HOME ?? process.cwd()}/var/records`"
        mineDataUrl: !!js "process.env.RESCUE_MCP_MINE_DATA_URL ?? 'http://127.0.0.1:8101/mcp'"
        mineDataToken: !!js "process.env.RESCUE_MCP_MINE_DATA_TOKEN || process.env.RESCUE_MCP_TOKEN || undefined"
        panel: !!js "process.env.RESCUE_MAP_PANEL || undefined"
        autopilot: !!js "process.env.RESCUE_MAP_AUTOPILOT !== '0'"   # 自动叠加（等级、报警、火区、新告警自动定位）
        debug: !!js "process.env.RESCUE_MAP_DEBUG === '1'"   # 调试路由 POST /rescue-map/emit，只在开发时开

    - id: rescue-audit
      name: '@rescue/dsh-bundle/audit'
      config:
        path: !!js "process.env.RESCUE_AUDIT_LOG ?? (process.env.RESCUE_HOME ?? process.cwd()) + '/var/audit/tool-actions.jsonl'"
        gatedServer: actions

    # 值班会话唤醒（第三版 P3，验证清单 #24）：扫描事件库（常驻监听器写的），把未投递的告警投递到值班会话，
    # 没有任何网页端连接也能工作。全局一份，不放进预设。
    - id: rescue-wake
      name: '@rescue/dsh-bundle/wake'
      config:
        incidentDir: !!js "process.env.RESCUE_INCIDENT_DIR || `${process.env.RESCUE_HOME ?? process.cwd()}/var/incidents`"
        cwd: !!js "process.env.RESCUE_DUTY_CWD || `${process.env.RESCUE_HOME ?? process.cwd()}/var/duty`"
        agentPreset: rescue-commander
        title: 值班会话（监听器告警）
        pollMs: 2000
